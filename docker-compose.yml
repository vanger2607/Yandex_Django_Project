version: "3.8"

services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./yamozgi/:/app
    ports:
      - "8000:8000"
    env_file:
      - ./yamozgi/.env
      
    depends_on:
      - redis

  worker:
    build: .
    command: celery -A yamozgi worker -l info
    volumes:
      - ./yamozgi/:/app
    environment:
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      - redis
      - web

  beat:
    build: .
    command: celery -A yamozgi beat -l info
    volumes:
      - ./yamozgi/:/app
    env_file:
      - ./yamozgi/.env
    depends_on:
      - redis
      - web

volumes:
  redis_data:
